anthropic:
  interface: anthropic
  api_key_env: ANTHROPIC_API_KEY
  max_retries: 3
  pricing:
    mode: token
    models:
      claude-sonnet-4-6:
        input_per_1m: 3.0
        output_per_1m: 15.0
        cached_input_per_1m: 0.3
      claude-opus-4-8:
        input_per_1m: 15.0
        output_per_1m: 75.0
        cached_input_per_1m: 1.5

openai:
  interface: openai
  api_key_env: OPENAI_API_KEY
  max_retries: 3
  pricing:
    mode: token
    models:
      gpt-5.5:
        input_per_1m: 5.0
        output_per_1m: 15.0

bedrock-anthropic:
  interface: bedrock-anthropic
  api_key_env: AWS_BEARER_TOKEN_BEDROCK
  region: us-east-2
  prefix: us.anthropic.
  max_retries: 2
  pricing:
    mode: token
    models:
      claude-sonnet-4-6:
        input_per_1m: 3.0
        output_per_1m: 15.0

bedrock-openai:
  interface: bedrock-openai
  api_key_env: AWS_BEARER_TOKEN_BEDROCK
  region: us-east-2
  prefix: openai.
  base_url: https://bedrock-mantle.us-east-2.api.aws/v1
  max_retries: 2
  pricing:
    mode: token
    models:
      gpt-5.5:
        input_per_1m: 5.0
        output_per_1m: 15.0

gpu-office:
  interface: openai
  base_url: https://llm-gateway.example.internal/v1
  api_key_env: GPU_OFFICE_API_KEY
  timeout_s: 120
  verify_tls: false
  max_retries: 1
  pricing:
    mode: hourly
    models:
      qwen2.5:72b:
        cost_per_hour: 1.8
      default:
        cost_per_hour: 1.2
